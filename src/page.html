const CERR={rate_limited:'Terlalu banyak pesan. Coba lagi nanti.',captcha_failed:'Verifikasi captcha gagal. Coba lagi.',invalid_input:'Periksa kembali nama, email, dan pesan (minimal 5 karakter).',not_configured:'Form kontak belum dikonfigurasi di server.'};
async function sendC(form){const st=$('cs'),btn=form.querySelector('button.btn'),v=n=>form.elements[n].value.trim();st.className='';
if(!tsTok){st.className='dw';st.textContent='Selesaikan captcha terlebih dahulu.';return}
btn.disabled=true;st.textContent='Mengirim…';
try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('name'),email:v('email'),message:v('message'),website:form.elements.website.value,token:tsTok})});
const d=await r.json().catch(()=>({}));
if(r.ok&&d.ok){st.className='up';st.textContent='Terima kasih, pesan Anda terkirim.';form.reset()}else{st.className='dw';st.textContent=CERR[d.error]||'Pesan belum bisa dikirim. Coba lagi nanti.'}}
catch(e){st.className='dw';st.textContent='Pesan belum bisa dikirim. Periksa koneksi Anda.'}
finally{btn.disabled=false;tsTok='';if(tsId!==null&&window.turnstile)window.turnstile.reset(tsId)}}

function tkUi(){const e=$('tk');if(!e)return;const c=Cc.all,d=c&&c.v;
if(!d||!d.fees){e.innerHTML='<span>Memuat harga dan fee…</span>';return}
const old=d.updatedAt&&Date.now()/1e3-d.updatedAt>300;
e.innerHTML=`<span>BTC/USD <b>${d.price!=null?'$'+f(d.price):'-'}</b></span><span>High <b>${f2(d.fees.fastestFee)}</b> <i>sat/vB</i></span><span>Medium <b>${f2(d.fees.halfHourFee)}</b></span><span>Low <b>${f2(d.fees.hourFee)}</b></span><span class="age"><u class="${old?'old':''}"></u>${d.updatedAt?(old?'Data lama · ':'')+agoS(d.updatedAt)+' lalu':'Live'}</span>`}

let cur='fee',rid=0,first=true;
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return (h>>>0).toString(36)+s.length};
const edited=e=>e.tagName==='SELECT'?[...e.options].some(o=>o.selected!==o.defaultSelected):e.value!==e.defaultValue;
const capVals=o=>{const m={};o.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{if(edited(e))m[e.id]=e.value});return m};
const restVals=(n,m)=>Object.keys(m).forEach(id=>{const e=n.querySelector('#'+id);if(e)e.value=m[id]});
const stamp=a=>[...a.children].forEach(n=>{n.dataset.h=hash(n.innerHTML)});
const render=r=>{try{return P[r]()}catch(e){console.error(e);return '<section class="s"><div class="sh"><h2>Terjadi kesalahan</h2></div><div class="sb"><p class="na">Halaman gagal ditampilkan karena data dari sumber tidak sesuai format. Coba muat ulang.</p></div></section>'}};
function after(){if(cur==='konverter'){if(!cvT)cv(0);fx()}if(cur==='fee'){applyG();applyOB(false)}}
function paint(whole){const a=$('app');if(!a)return;const html=render(cur);
if(whole){a.innerHTML=html;stamp(a);tkUi();after();return}
const t=document.createElement('div');t.innerHTML=html;const nw=[...t.children],od=[...a.children];
if(nw.length!==od.length){a.innerHTML=html;stamp(a);tkUi();after();return}
let ch=false;
nw.forEach((n,i)=>{const o=od[i],h=hash(n.innerHTML);if(o.dataset.h===h)return;
const ae=document.activeElement;if(ae&&o.contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
const kv=capVals(o),sl=(o.querySelector('.blocks')||{}).scrollLeft;n.dataset.h=h;if(o.dataset.b==='1')n.classList.add('in');if(o.classList.contains('v'))n.classList.add('v');o.replaceWith(n);restVals(n,kv);const nb=n.querySelector('.blocks');if(nb&&sl)nb.scrollLeft=sl;ch=true});
tkUi();if(ch)after()}

function route(){const my=++rid;OB=-1;const hh=location.hash.slice(1)||'fee',sl=hh.indexOf('/');let r=sl>0?hh.slice(0,sl):hh;ARG=sl>0?hh.slice(sl+1):'';
if(!P[r])r='fee';
if(r==='block'&&!(hex64(ARG)||/^\d{1,7}$/.test(ARG)))r='mining';
if(r==='tx'&&!hex64(ARG))r='mining';
const lk=r+'/'+ARG;if(lk!==LASTR){LASTR=lk;BP=0;HFAIL=''}
cur=r;cvT=0;
if(r==='block'&&/^\d{1,7}$/.test(ARG)){const h0=ARG;gtx('/block-height/'+h0).then(t=>{t=t.trim();if(hex64(t)&&ARG===h0&&cur==='block')location.replace('#block/'+t);else throw 0}).catch(()=>{HFAIL=h0;sched()})}const a=$('app');
document.querySelectorAll('nav [data-r]').forEach(x=>x.classList.toggle('on',x.dataset.r==(r==='block'||r==='tx'?'mining':r)));
document.querySelector('.dd').classList.toggle('on',r.indexOf('stats')==0);
$('nv').classList.remove('o');$('mb').setAttribute('aria-expanded','false');
const need=typeof NEED[r]==='function'?NEED[r]():NEED[r]||[];
need.map(x=>x[0]).concat('all').forEach(k=>{if(!Cc[k]){const o=lsGet(k);if(o)Cc[k]=o}});
need.forEach(([k])=>{if(!Cc[k])PEND.add(k)});
a.className='w';paint(true);a.classList.remove('pg');void a.offsetWidth;a.classList.add('pg');
if(!first)scrollTo(0,0);first=false;
need.forEach(([k,u])=>ld(k,u));
if(!need.some(x=>x[0]=='all'))ld('all','/api/all');
if(r=='kontak')initTs();
if(r=='explorer'&&pend){const v=pend;pend=null;$('q').value=v;org=v;show(v)}}

document.addEventListener('click',e=>{const ob=e.target.closest&&e.target.closest('.bk,.obx');if(ob){OB=ob.classList.contains('obx')?-1:(OB===[...ob.parentNode.children].indexOf(ob)?-1:[...ob.parentNode.children].indexOf(ob));applyOB(true);return}const g=e.target.closest&&e.target.closest('#gg [data-f]');if(g){GF=+g.dataset.f;applyG();return}
const t=e.target.closest&&e.target.closest('[data-x],[data-s],[data-back]');if(!t)return;
if(t.hasAttribute('data-back')){show(org);return}
e.preventDefault();if(t.dataset.x!=null)gx(t.dataset.x);else{show(t.dataset.s);scrollTo({top:0})}});
document.addEventListener('submit',e=>{const t=e.target;if(t.id==='xf'){e.preventDefault();go()}else if(t.id==='cf'){e.preventDefault();sendC(t)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.cv!=null){cvT=1;cv(+t.dataset.cv)}else if(t.id==='rt'){cvT=1;cv(0)}else if(t.dataset&&t.dataset.fx!=null)fx()});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-bp]');if(!t)return;BP=+t.dataset.bp||0;route()});
addEventListener('hashchange',route);
$('mb').onclick=()=>{const o=$('nv').classList.toggle('o');$('mb').setAttribute('aria-expanded',String(o))};
document.querySelector('.dd>button').onclick=e=>e.currentTarget.parentNode.classList.toggle('o');
$('th').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches,n=dark?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};
$('yr').textContent=new Date().getFullYear();
(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const px=document.querySelector('.px');let q=0;
const run=()=>{q=0;const y=Math.round(scrollY);if(px)px.style.setProperty('--sy',y);const h=document.querySelector('.hd');if(h)h.style.setProperty('--sy',y)};
addEventListener('scroll',()=>{if(!q)q=requestAnimationFrame(run)},{passive:true});run();
if('IntersectionObserver' in window){document.documentElement.classList.add('rv');
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('v');io.unobserve(en.target)}}),{rootMargin:'0px 0px -6% 0px'});
const scan=()=>document.querySelectorAll('#app .s:not(.v)').forEach(n=>io.observe(n));
new MutationObserver(scan).observe($('app'),{childList:true});scan()}})();

const tick=()=>{if(document.hidden)return;ld('all','/api/all',true);if(cur==='fee')ld('mb','/v1/fees/mempool-blocks',true)};
setInterval(tick,60000);setInterval(tkUi,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const c=Cc.all;if(!c||Date.now()-c.t>60000)tick()}});
route();
})();
</script></body></html>
